<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | NexStore</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation Bar (Simple) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary" href="index.html">Nex<span
                    class="text-dark">Store</span></a>
            <div class="ms-auto">
                <a href="shop.html" class="btn btn-outline-primary rounded-pill">Continue Shopping</a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="py-5">
        <div class="container">
            <h1 class="fw-bold mb-5">Shopping Cart</h1>

            <div class="row g-4">
                <!-- Cart Items -->
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table cart-table align-middle">
                            <thead class="text-muted">
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Total</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Item 1 -->
                                <tr class="cart-item">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <img src="https://images.unsplash.com/photo-1525547718571-0394998ee601?q=80&w=100&h=100&fit=crop"
                                                class="me-3" alt="Laptop">
                                            <div>
                                                <h6 class="mb-0 fw-bold">ProBook X360 Laptop</h6>
                                                <small class="text-muted">Space Gray, 512GB</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="fw-bold">$1,299</td>
                                    <td>
                                        <div class="input-group input-group-sm" style="width: 100px;">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <input type="text" class="form-control text-center" value="1">
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                    </td>
                                    <td class="fw-bold text-primary">$1,299</td>
                                    <td class="text-end">
                                        <button class="btn btn-link text-danger p-0"><i
                                                class="bi bi-trash fs-5"></i></button>
                                    </td>
                                </tr>
                                <!-- Item 2 -->
                                <tr class="cart-item">
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=100&h=100&fit=crop"
                                                class="me-3" alt="Headphones">
                                            <div>
                                                <h6 class="mb-0 fw-bold">Noise Cancel Headphones</h6>
                                                <small class="text-muted">Matte Black</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="fw-bold">$299</td>
                                    <td>
                                        <div class="input-group input-group-sm" style="width: 100px;">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <input type="text" class="form-control text-center" value="2">
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                    </td>
                                    <td class="fw-bold text-primary">$598</td>
                                    <td class="text-end">
                                        <button class="btn btn-link text-danger p-0"><i
                                                class="bi bi-trash fs-5"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <div class="input-group border-0 shadow-sm" style="max-width: 300px;">
                            <input type="text" class="form-control rounded-start" placeholder="Coupon Code">
                            <button class="btn btn-dark rounded-end" type="button">Apply</button>
                        </div>
                        <button class="btn btn-outline-danger">Clear Cart</button>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-4">Order Summary</h5>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Subtotal</span>
                            <span>$1,897.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Shipping</span>
                            <span class="text-success">Free</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Estimated Tax</span>
                            <span>$151.76</span>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between mb-4">
                            <h4 class="fw-bold">Total</h4>
                            <h4 class="fw-bold text-primary">$2,048.76</h4>
                        </div>
                        <button class="btn btn-primary btn-lg w-100 py-3 mb-3">Proceed to Checkout</button>
                        <div class="text-center">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" height="25"
                                class="me-3 opacity-50" alt="Paypal">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg"
                                height="15" class="opacity-50" alt="Visa">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer (Simple) -->
    <footer class="bg-white py-4 mt-auto border-top">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2024 NexStore. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
